<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 40 244 182" fill="none">
  <defs>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BDB74"/><stop offset="1" stop-color="#63B650"/></linearGradient>
    <linearGradient id="soilL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6A4A"/><stop offset="1" stop-color="#6F523A"/></linearGradient>
    <linearGradient id="soilR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F523A"/><stop offset="1" stop-color="#5A412E"/></linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E4DDF3"/><stop offset="1" stop-color="#D2C8EA"/></linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAFB"/></linearGradient>
    <linearGradient id="woodL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9784A"/><stop offset="1" stop-color="#A2663C"/></linearGradient>
    <linearGradient id="woodR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D69462"/><stop offset="1" stop-color="#C4824F"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD2FF"/><stop offset="1" stop-color="#5FA6EC"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FE0FF"/><stop offset="1" stop-color="#3FA9E8"/></linearGradient>
    <radialGradient id="leaf" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#7FD16A"/><stop offset="1" stop-color="#3E9A45"/></radialGradient>
  </defs>

  <!-- ground slab -->
  <polygon points="40,150 150,205 150,216 40,161" fill="url(#soilL)"/>
  <polygon points="150,205 260,150 260,161 150,216" fill="url(#soilR)"/>
  <polygon points="150,95 260,150 150,205 40,150" fill="url(#lawn)"/>
  <polygon points="150,104 242,150 150,196 58,150" fill="#A9E383" opacity="0.35"/>
  <!-- garden path -->
  <polygon points="125,152.5 138,159 100,178 87,171.5" fill="#EBDDBB"/>

  <!-- pool -->
  <polygon points="200,149 226,162 164,193 138,180" fill="#F4F1FB"/>
  <polygon points="202,151 224,162 164,192 142,181" fill="url(#water)"/>
  <path d="M180 170 q6 -3 12 0 M170 177 q6 -3 12 0 M192 164 q5 -2.5 10 0" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

  <!-- soft shadow under villa -->
  <polygon points="96,141 156,171 206,146 146,116" fill="#2E7D32" opacity="0.18"/>

  <!-- main body -->
  <polygon points="100,140 155,167.5 155,117.5 100,90" fill="url(#wallL)"/>
  <polygon points="155,167.5 200,145 200,95 155,117.5" fill="url(#wallR)"/>
  <polygon points="145,67.5 200,95 155,117.5 100,90" fill="#FFFFFF" stroke="#D5CCEB" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- roof slab edge -->
  <polygon points="100,90 155,117.5 155,122 100,94.5" fill="#CFC6E6"/>
  <polygon points="155,117.5 200,95 200,99.5 155,122" fill="#E3DCF3"/>

  <!-- ground-floor windows (left face) -->
  <polygon points="108.25,132.1 122,139 122,115 108.25,108.1" fill="url(#glass)" stroke="#6B52B3" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="133,144.5 146.75,151.4 146.75,127.4 133,120.5" fill="url(#glass)" stroke="#6B52B3" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- glass doors (right face) -->
  <polygon points="164,163 179.75,155.1 179.75,123.1 164,131" fill="url(#glass)" stroke="#6B52B3" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="171.9" y1="159" x2="171.9" y2="127" stroke="#6B52B3" stroke-width="1.4"/>
  <polygon points="184.25,138.9 193.25,134.4 193.25,112.4 184.25,116.9" fill="url(#glass)" stroke="#6B52B3" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- upper floor -->
  <polygon points="130,90 170,110 170,82 130,62" fill="url(#woodL)"/>
  <polygon points="170,110 195,97.5 195,69.5 170,82" fill="url(#woodR)"/>
  <polygon points="155,49.5 195,69.5 170,82 130,62" fill="#FFFFFF" stroke="#D5CCEB" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="130,62 170,82 170,86.5 130,66.5" fill="#CFC6E6"/>
  <polygon points="170,82 195,69.5 195,74 170,86.5" fill="#E3DCF3"/>
  <polygon points="138,88 162,100 162,84 138,72" fill="url(#glass)" stroke="#FFF3E6" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="150" y1="94" x2="150" y2="78" stroke="#FFF3E6" stroke-width="1.3"/>
  <!-- balcony rail -->
  <path d="M171 100 L194 88.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M176 98 v-6 M182 95 v-6 M188 92 v-6" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>

  <!-- trees -->
  <rect x="62" y="124" width="5" height="26" rx="2" fill="#7A5638"/>
  <circle cx="64" cy="112" r="19" fill="url(#leaf)"/>
  <circle cx="53" cy="119" r="11" fill="url(#leaf)"/>
  <circle cx="76" cy="120" r="11" fill="url(#leaf)"/>
  <rect x="231" y="128" width="4" height="20" rx="2" fill="#7A5638"/>
  <circle cx="233" cy="118" r="13" fill="url(#leaf)"/>
  <circle cx="224" cy="124" r="8" fill="url(#leaf)"/>
  <rect x="88" y="166" width="3.5" height="12" rx="1.5" fill="#7A5638"/>
  <circle cx="90" cy="161" r="9" fill="url(#leaf)"/>

  <!-- string lights from tree to villa -->
  <path d="M70 100 Q 86 108 102 94" stroke="#7A5638" stroke-width="1" fill="none" opacity="0.6"/>
  <g fill="#FFD36B">
    <circle cx="74" cy="102" r="2.3"/><circle cx="82" cy="106" r="2.3"/><circle cx="90" cy="106.5" r="2.3"/><circle cx="97" cy="101.5" r="2.3"/>
  </g>
  <g fill="#FFD36B" opacity="0.28">
    <circle cx="74" cy="102" r="5"/><circle cx="82" cy="106" r="5"/><circle cx="90" cy="106.5" r="5"/><circle cx="97" cy="101.5" r="5"/>
  </g>
</svg>
